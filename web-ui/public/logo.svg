<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f3ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>
  <!-- 外发光 -->
  <circle cx="48" cy="48" r="46" fill="#8b5cf6" opacity="0.12"/>
  <circle cx="48" cy="48" r="39" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.28"/>
  <!-- 主体菱形 -->
  <polygon points="48,7 89,48 48,89 7,48" fill="url(#bg)" stroke="#c084fc" stroke-width="2"/>
  <!-- 内层亮线（普瑞赛斯菱形特征） -->
  <polygon points="48,21 75,48 48,75 21,48" fill="none" stroke="#e9d5ff" stroke-width="1.4" opacity="0.85"/>
  <!-- 核心高光菱形 -->
  <polygon points="48,31 65,48 48,65 31,48" fill="url(#core)"/>
  <!-- 中心点 -->
  <circle cx="48" cy="48" r="4.5" fill="#ffffff"/>
</svg>

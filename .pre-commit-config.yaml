# pre-commit 配置（ROADMAP R9）：提交前本地质量闸门
# 安装：uv tool install pre-commit && pre-commit install
# 手动运行：pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.16.3
    hooks:
      - id: uv-lock-check

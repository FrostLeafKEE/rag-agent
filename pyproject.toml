[project]
name = "rag-enterprise"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "docling>=2.120.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-community<0.4",
    "langchain-openai>=1.5.1",
    "langfuse>=4.14.4",
    "langgraph>=1.2.11",
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pymilvus>=2.5,<3",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "ragas>=0.4.3",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52",
    "websockets==15.0.1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008：FastAPI 依赖注入标准模式（Depends() 作参数默认值）
ignore = ["B008"]

# 测试代码行长不作严格要求（断言/构造语句常见超长）
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]


[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["web-ui/", "tests/"]
